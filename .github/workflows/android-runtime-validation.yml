name: Android Runtime Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run Android instrumentation tests and collect diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.kazembarani.ai || true
            adb shell monkey -p com.kazembarani.ai 1 || true
            sleep 3
            mkdir -p runtime-diagnostics
            adb logcat -d -t 1000 > runtime-diagnostics/logcat.txt
            adb exec-out screencap -p > runtime-diagnostics/screenshot.png

      - name: Upload APK and Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-validation
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            runtime-diagnostics/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
